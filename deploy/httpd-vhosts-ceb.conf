# =====================================================================
# Apache virtual hosts for the CEB Uva Province asset system.
#
# Paste both blocks into:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# then restart Apache from the XAMPP Control Panel.
#
# ---------------------------------------------------------------------
# WHY THE ORDER OF THESE TWO BLOCKS MATTERS
#
# Apache uses the FIRST virtual host on a port as the default: any
# hostname it does not recognise is served by that one.
#
# The application is first on purpose. Colleagues on the office network
# open this machine by its IP address (http://192.168.1.4) or by its
# computer name (http://ASUSI3), and neither of those is a name Apache
# has been told about. Being the default is what makes every one of them
# reach the application -- including a new IP tomorrow, because the
# address is handed out by DHCP and will change.
#
# localhost is declared second and explicitly, so it keeps serving
# htdocs and http://localhost/phpmyadmin keeps working on this machine.
# An exact match always beats the default.
# ---------------------------------------------------------------------


# 1. THE APPLICATION -- and the default for every unrecognised address,
#    which is how the office network reaches it.
#
#    DocumentRoot is the backend's public/ folder, NOT the project root.
#    Everything above public/ -- .env with the database password, the
#    vendor tree, the SQL files in database/ -- must stay unreachable
#    over HTTP, and pointing Apache one level higher exposes all of it.
#
#    NOTE THE PATH. This project is not in htdocs; it is on D: and the
#    path contains a space ("My Project"). Apache needs forward slashes,
#    and the quotes are not optional -- without them the space ends the
#    argument and Apache refuses to start.
<VirtualHost *:80>
    ServerName ceb-uva.test

    # Named as well as being the default, so these keep working even if
    # another vhost is ever added above this one.
    ServerAlias ASUSI3
    ServerAlias 192.168.1.4

    DocumentRoot "D:/My Project/CEB/ceb-uva-assets/backend/public"

    <Directory "D:/My Project/CEB/ceb-uva-assets/backend/public">
        # AllowOverride All is required, not cosmetic: Laravel's routing
        # lives in public/.htaccess, and without this Apache ignores that
        # file and every URL except / returns 404.
        AllowOverride All
        Require all granted

        # No directory listings. public/ holds the built JS and CSS and
        # there is no reason for it to be browsable.
        Options -Indexes +FollowSymLinks
    </Directory>

    # Separate logs, so a problem here is not buried in the shared XAMPP
    # error log alongside everything else on this machine.
    ErrorLog  "logs/ceb-uva-error.log"
    CustomLog "logs/ceb-uva-access.log" common
</VirtualHost>


# 2. localhost -- unchanged behaviour, so phpMyAdmin stays where it is.
#
#    127.0.0.1 is aliased because it is a different name to Apache than
#    "localhost"; without it, http://127.0.0.1/phpmyadmin would fall
#    through to the default above and serve the application instead.
<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    DocumentRoot "C:/xampp/htdocs"

    <Directory "C:/xampp/htdocs">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
